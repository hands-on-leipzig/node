# Deploy workflow:
# - Push/merge to main → deploy to TEST (secrets: TEST_DEPLOY_*)
# - Publish a Release → deploy to PROD (secrets: DEPLOY_*)
#
# Optional e-mail on published GitHub Release only (repository variable DEPLOY_NOTIFY_ENABLED=true).
# Microsoft 365 via Graph OAuth (client credentials) — no SMTP.
# Entra app: Application permission Mail.Send + admin consent.
# Secrets:
#   DEPLOY_NOTIFY_MS_TENANT_ID
#   DEPLOY_NOTIFY_MS_CLIENT_ID
#   DEPLOY_NOTIFY_MS_CLIENT_SECRET
#   DEPLOY_NOTIFY_MAIL_FROM   — sender mailbox UPN (e.g. noreply@…)
#   DEPLOY_NOTIFY_EMAIL_TO    — recipient(s), comma-separated

name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write site build-info.json
        run: |
          node -e "require('fs').writeFileSync('public/build-info.json', JSON.stringify({ builtAt: new Date().toISOString(), sha: process.env.GITHUB_SHA || '' }))"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Build (test — uses .env + .env.test → dev API)
        run: npm run build:test

      - name: Setup SSH key
        env:
          DEPLOY_PORT: ${{ secrets.TEST_DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.TEST_DEPLOY_PORT }}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.TEST_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to test via rsync
        env:
          DEPLOY_PORT: ${{ secrets.TEST_DEPLOY_PORT }}
        run: |
          PORT="${{ secrets.TEST_DEPLOY_PORT }}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $PORT" \
            dist/ \
            ${{ secrets.TEST_DEPLOY_USER }}@${{ secrets.TEST_DEPLOY_HOST }}:${{ secrets.TEST_DEPLOY_PATH }}/

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write site build-info.json
        run: |
          node -e "require('fs').writeFileSync('public/build-info.json', JSON.stringify({ builtAt: new Date().toISOString(), sha: process.env.GITHUB_SHA || '' }))"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Build
        run: npm run build

      - name: Setup SSH key
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to prod via rsync
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $PORT" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Notify release deploy by email (Microsoft Graph)
        if: always() && github.event_name == 'release' && vars.DEPLOY_NOTIFY_ENABLED == 'true'
        continue-on-error: true
        env:
          MS_TENANT_ID: ${{ secrets.DEPLOY_NOTIFY_MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.DEPLOY_NOTIFY_MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.DEPLOY_NOTIFY_MS_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.DEPLOY_NOTIFY_MAIL_FROM }}
          MAIL_TO: ${{ secrets.DEPLOY_NOTIFY_EMAIL_TO }}
          JOB_STATUS: ${{ job.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          ACTOR: ${{ github.actor }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deploy/notify-release-email-graph.sh
